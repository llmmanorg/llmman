name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The single place to bump when a newer llama.cpp release is needed —
  # every matrix.llama-asset entry below (e2e job) is just this release's
  # OS/arch-specific asset suffix (e.g. "ubuntu-x64.tar.gz"), combined
  # with this value at the "Install llama-server" step's own point of use
  # ("llama-${LLAMA_CPP_RELEASE}-bin-${{ matrix.llama-asset }}") rather
  # than each duplicating the full "llama-<release>-bin-..." filename
  # independently.
  LLAMA_CPP_RELEASE: b10293

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ──────────────────────────────────────────────────
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            go-os: linux
            binary: llmman

          # ── Linux aarch64 ─────────────────────────────────────────────────
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            go-os: linux
            binary: llmman

          # ── macOS aarch64 (Apple Silicon) ─────────────────────────────────
          - target: aarch64-apple-darwin
            runner: macos-15
            go-os: darwin
            binary: llmman

          # ── Windows x86_64 ────────────────────────────────────────────────
          # lld-link is used instead of MSVC link.exe: it accepts clang's
          # .pdata format (fixing LNK1223) and GNU ar archives (fixing LNK4003).
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            go-os: windows
            binary: llmman.exe
            msvc-arch: amd64
            rustflags: "-C linker=lld-link"

          # ── Windows aarch64 ───────────────────────────────────────────────
          # ARM64 uses the MSVC-native link.exe (put first in PATH by
          # ilammy/msvc-dev-cmd) rather than lld-link: the lld-link in
          # C:\Program Files\LLVM\bin on the ARM64 runner is an x86_64
          # binary running under emulation; it opens ARM64 archives but
          # silently ignores ARM64 COFF objects (machine type mismatch),
          # reporting every CGO export as an undefined symbol.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            go-os: windows
            binary: llmman.exe
            msvc-arch: arm64
            rustflags: ""

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # ── Go toolchain ──────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-shim/go.sum

      # ── Rust toolchain ────────────────────────────────────────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.target }}

      # ── Go module cache ───────────────────────────────────────────────────
      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ matrix.go-os }}-${{ hashFiles('go-shim/go.sum') }}
          restore-keys: go-${{ matrix.go-os }}-

      # ── Windows: set up MSVC with the correct target architecture ─────────
      # msvc-arch is explicit in the matrix so the ARM64 runner gets the ARM64
      # toolchain rather than the default x64, which would cause the wrong
      # assembler to be used when CGO compiles Go's ARM64 runtime stubs.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.msvc-arch }}

      # ── Linux: C compiler (always needed for CGO) ─────────────────────────
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc

      # ── Diagnostics: show which C/linker tools will be used (Windows) ───────
      - name: Show Windows toolchain info
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== clang ===" ; where.exe clang ; clang --version 2>&1 | Select-Object -First 1
          Write-Host "=== lld-link ===" ; where.exe lld-link 2>&1 ; (Get-Command lld-link -ErrorAction SilentlyContinue)?.Source
          Write-Host "=== link ===" ; where.exe link 2>&1 | Select-Object -First 1

      # ── Build (Docker backend, default) ───────────────────────────────────
      - name: Build (docker backend)
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # ── Build (Podman backend) ────────────────────────────────────────────
      # Skipped on Windows: containers/image has no Windows support.
      - name: Build (podman backend)
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features podman
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # ── Diagnostics: inspect the Go shim library on Windows ARM64 ───────────
      - name: Inspect shim library (Windows aarch64)
        if: always() && matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $lib = Get-ChildItem -Recurse -Path "target" -Filter "llmman_shim.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($lib) {
            Write-Host "Found: $($lib.FullName) ($($lib.Length) bytes)"
            dumpbin /HEADERS "$($lib.FullName)" 2>&1 | Select-Object -First 20
            dumpbin /EXPORTS "$($lib.FullName)" 2>&1 | Select-String "llmman"
          } else {
            Write-Host "llmman_shim.lib NOT FOUND"
          }

      # ── Upload artefacts ──────────────────────────────────────────────────
      - name: Upload binary (docker)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llmman-docker-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Unit tests: every #[cfg(test)] module under src/ (`cargo test --bin`,
  # since this crate has no lib target — see Cargo.toml). These are pure-
  # Rust logic tests with no OS-specific behavior, but the crate itself
  # still links the Go shim via CGO, so a target-specific toolchain issue
  # (the exact kind the `build`/`e2e` jobs' own git history is full of —
  # lld-link vs MSVC link.exe, msvc-arch, ...) could just as easily break
  # `cargo test` as `cargo build`. Mirrors the `build` job's own 5-target
  # matrix exactly for that reason, rather than assuming Linux x86_64 is
  # representative of the other four.
  # --------------------------------------------------------------------------
  test:
    name: Unit tests (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ──────────────────────────────────────────────────
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            go-os: linux

          # ── Linux aarch64 ─────────────────────────────────────────────────
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            go-os: linux

          # ── macOS aarch64 (Apple Silicon) ─────────────────────────────────
          - target: aarch64-apple-darwin
            runner: macos-15
            go-os: darwin

          # ── Windows x86_64 ────────────────────────────────────────────────
          # lld-link, not MSVC link.exe — see the `build` job's own comment
          # on why (same CGO-produced-object-format issue, native build or
          # not).
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            go-os: windows
            msvc-arch: amd64
            rustflags: "-C linker=lld-link"

          # ── Windows aarch64 ───────────────────────────────────────────────
          # rustflags empty (MSVC-native link.exe, not lld-link) — see the
          # `build` job's own comment on why this one architecture is the
          # opposite of the x86_64 Windows entry just above.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            go-os: windows
            msvc-arch: arm64
            rustflags: ""

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-shim/go.sum

      # targets: matches the build job's own Set up Rust step — needed
      # there for genuinely cross-compiled targets, harmless here where
      # every target is actually native.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: test-${{ matrix.target }}

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ matrix.go-os }}-${{ hashFiles('go-shim/go.sum') }}
          restore-keys: go-${{ matrix.go-os }}-

      # ── Windows: set up MSVC (needed for CGO, same as the `build` job) ────
      # arch: matrix-driven (not a hardcoded amd64) — the ARM64 runner
      # needs the ARM64 toolchain, or CGO compiling Go's ARM64 runtime
      # stubs would use the wrong assembler (see the `build` job's own
      # comment on its identical msvc-arch matrix field).
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.msvc-arch }}

      # ── Linux: C compiler (always needed for CGO). macOS/Windows need
      # neither: Xcode's command-line tools already provide a C compiler
      # on the macOS runner image, and Windows' MSVC setup above covers it.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc

      # --target: matches the build job's own invocation (every one of
      # these is a native build, but explicit --target keeps the output
      # path/build-plan identical to that job's). RUSTFLAGS is needed here
      # too, not just on a separate build step — see the e2e job's own
      # comment on cargo test compiling its own separate test binary,
      # which links against the same Go-shim-produced llmman_shim.lib the
      # main binary does and hit the exact same lld-link requirement.
      - name: cargo test --bin llmman
        run: cargo test --release --target ${{ matrix.target }} --bin llmman
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

  # --------------------------------------------------------------------------
  # E2E: `llmman launch <claude|opencode|codex> --model qwen3.5:0.8b`
  # (tests/launch_e2e.rs) against a real `llmman serve`, a real pulled model,
  # a real llama-server, and the real third-party CLIs — not mocks. Mirrors
  # the `build` job's own 5-target matrix exactly (same runners, same
  # msvc-arch/rustflags choices), so the launch/env/config plumbing this
  # actually exercises gets checked on every platform/architecture llmman
  # ships a binary for, not just a subset of them.
  # --------------------------------------------------------------------------
  e2e:
    name: E2E (launch claude/opencode/codex) — ${{ matrix.target }} (${{ matrix.backend }})
    runs-on: ${{ matrix.runner }}
    # 25 was set back when this only ever ran on ubuntu-24.04 (a typical
    # run there takes 5-7 minutes total). Confirmed against real
    # windows-2025/windows-11-arm runs that setup+build overhead alone
    # (checkout, toolchains, npm installs, cargo build) already consumes
    # 5-8 of those minutes on Windows, before any of tests/launch_e2e.rs's
    # own three tests even start. Those three tests run serialized
    # (--test-threads=1 + lock_serial()), so the real worst case sums all
    # three's own retry budgets, not just one: claude and codex each cap
    # at DEFAULT_MAX_ATTEMPTS * TIMEOUT (3 * 600s = 30 min), opencode at
    # OPENCODE_MAX_ATTEMPTS * TIMEOUT (4 * 600s = 40 min, bumped after CI
    # run 32376290299 exhausted 3/3 attempts on two platforms at once for
    # opencode specifically) — 8 + 30 + 40 + 30 = 108 minutes. 120 leaves
    # real headroom for that worst case across every platform, not just
    # the fastest one.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 (docker backend) ────────────────────────────────
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            go-os: linux
            llama-asset: ubuntu-x64.tar.gz
            backend: docker
            feature-flags: ""

          # ── Linux aarch64 (docker backend) ───────────────────────────────
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            go-os: linux
            llama-asset: ubuntu-arm64.tar.gz
            backend: docker
            feature-flags: ""

          # ── Linux x86_64 (podman backend) ────────────────────────────────
          # Same runner/llama-asset as the docker entry above, just linked
          # against go-shim/backend_podman.go (go.podman.io/image) instead
          # of go-shim/backend_docker.go — this is the only place that
          # backend's actual pull/push code path gets exercised end-to-end
          # against a real registry; the `test` job's own unit tests never
          # touch the ffi::* boundary that differs between backends, and
          # the `build` job only compiles this backend, it doesn't run it.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            go-os: linux
            llama-asset: ubuntu-x64.tar.gz
            backend: podman
            feature-flags: "--no-default-features --features podman"

          # ── Linux aarch64 (podman backend) ───────────────────────────────
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            go-os: linux
            llama-asset: ubuntu-arm64.tar.gz
            backend: podman
            feature-flags: "--no-default-features --features podman"

          # ── macOS aarch64 (Apple Silicon, docker backend) ────────────────
          - target: aarch64-apple-darwin
            runner: macos-15
            go-os: darwin
            llama-asset: macos-arm64.tar.gz
            backend: docker
            feature-flags: ""

          # ── Windows x86_64 (docker backend) ──────────────────────────────
          # lld-link, not MSVC link.exe — see the `build` job's own comment
          # on why (same CGO-produced-object-format issue, native build or
          # not). No podman entry: containers/image has no Windows support
          # (see the `build` job's own comment on its identical exclusion).
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            go-os: windows
            llama-asset: win-cpu-x64.zip
            msvc-arch: amd64
            rustflags: "-C linker=lld-link"
            backend: docker
            feature-flags: ""

          # ── Windows aarch64 (docker backend) ─────────────────────────────
          # rustflags empty (MSVC-native link.exe, not lld-link) — see the
          # `build` job's own comment on why this one architecture is the
          # opposite of the x86_64 Windows entry just above.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            go-os: windows
            llama-asset: win-cpu-arm64.zip
            msvc-arch: arm64
            rustflags: ""
            backend: docker
            feature-flags: ""

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-shim/go.sum

      # targets: matches the build job's own Set up Rust step — needed
      # there for genuinely cross-compiled targets, harmless here where
      # every target is actually native.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          # backend, not just target: the docker/podman entries sharing a
          # target build with different --features, and Cargo's target dir
          # doesn't itself key build artefacts by feature set — an
          # unqualified key here would have them fight over (and keep
          # invalidating) the same cache entry.
          key: e2e-${{ matrix.target }}-${{ matrix.backend }}

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ matrix.go-os }}-${{ hashFiles('go-shim/go.sum') }}
          restore-keys: go-${{ matrix.go-os }}-

      # ── Windows: set up MSVC (needed for CGO, same as the `build` job) ────
      # arch: matrix-driven (not a hardcoded amd64) — the ARM64 runner
      # needs the ARM64 toolchain, or CGO compiling Go's ARM64 runtime
      # stubs would use the wrong assembler (see the `build` job's own
      # comment on its identical msvc-arch matrix field).
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.msvc-arch }}

      # ── Linux: C compiler (always needed for CGO) + llama-server's own
      # runtime shared-library deps. macOS/Windows need neither: Xcode's
      # command-line tools already provide a C compiler on the macOS
      # runner image, and both platforms' llama-server release archives
      # are fully self-contained (verified via `strings`/load-command
      # inspection — no external libomp/libcurl reference either way).
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgomp1 libcurl4

      # ── Node.js (for the claude/opencode/codex CLIs under test) ────────────
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Each install is tolerated independently (`|| ...`, not `&&`-chained)
      # rather than failing the whole step — and so the whole job — the
      # moment one of these three isn't installable on a given OS: a
      # missing CLI just makes tests/launch_e2e.rs's own on_path check skip
      # that one integration's test instead, exactly as it already does
      # for a developer machine that simply doesn't have e.g. `codex`
      # installed. `shell: bash` (not the Windows default of `pwsh`) is
      # needed on every OS-agnostic step from here on for consistent `||`/
      # multi-line syntax; ubuntu/macOS already default to bash.
      - name: Install integration CLIs (claude, opencode, codex)
        shell: bash
        run: |
          npm install -g @anthropic-ai/claude-code || echo "::warning::claude-code install failed on ${{ runner.os }}"
          npm install -g opencode-ai || echo "::warning::opencode-ai install failed on ${{ runner.os }}"
          npm install -g @openai/codex || echo "::warning::codex install failed on ${{ runner.os }}"

      # opencode installs its configured provider's npm package (here
      # @ai-sdk/openai-compatible — see launch::opencode_config) on demand
      # into ~/.config/opencode/node_modules the first time a fresh HOME
      # uses it. Pay that cost here, separately diagnosable, instead of
      # inside tests/launch_e2e.rs's own per-launch timeout, so a slow
      # first-time install there can't masquerade as a hung launch.
      #
      # The target baseURL is deliberately unreachable (this only needs to
      # trigger the provider package install, not a real response) — which
      # means this can *only* ever time out, never exit cleanly: opencode's
      # ai-sdk runtime retries a failed connection indefinitely rather than
      # giving up, so there's no successful exit code to wait for once the
      # (fast) npm install itself is done. `timeout` (not the job's own
      # timeout-minutes) enforces a much shorter cap so this doesn't waste
      # CI time being deliberately, permanently unreachable, and `|| true`
      # tolerates the resulting SIGTERM/failure. Also tolerates opencode
      # itself not being installed (see the step above) — `command -v`
      # guards against that rather than failing here instead.
      #
      # `--kill-after=10`: confirmed live on a real x86_64-windows-2025 run
      # that plain `timeout 45` (SIGTERM only) can leave this hanging far
      # past its own 45s cap — the whole job ran to its 45-*minute*
      # timeout-minutes instead and got force-cancelled. A Node process
      # deep in this ai-sdk runtime's own indefinite connection-retry loop
      # doesn't reliably act on SIGTERM promptly (a known Node.js/libuv
      # quirk: a blocking native socket call in flight isn't necessarily
      # interrupted by a signal the event loop hasn't gotten back to yet),
      # so nothing here otherwise ever escalates to a harder kill.
      # `--kill-after` sends SIGKILL 10s after the initial SIGTERM if the
      # process is still alive, guaranteeing this step can't hang
      # regardless of whether opencode's own process tree responds to
      # SIGTERM at all.
      - name: Warm up opencode's on-demand provider install
        shell: bash
        run: |
          export OPENCODE_CONFIG_CONTENT='{"$schema":"https://opencode.ai/config.json","provider":{"ollama":{"npm":"@ai-sdk/openai-compatible","name":"Ollama","options":{"baseURL":"http://127.0.0.1:1/v1"},"models":{"warmup":{"name":"warmup"}}}},"model":"ollama/warmup"}'
          command -v opencode >/dev/null && timeout --kill-after=10 45 opencode run "hi" --print-logs --log-level DEBUG || true

      # ── llama-server (the inference backend `llmman serve` shells out to) ──
      # A prebuilt release straight from upstream llama.cpp, pinned so CI
      # doesn't silently pick up a build that changes behavior mid-flight;
      # bump the top-level env's LLAMA_CPP_RELEASE deliberately when a
      # newer one is needed — that one edit is enough, unlike the old
      # per-matrix-entry hardcoded filenames it replaced. `matrix.llama-asset`
      # is just this OS/arch's release asset *suffix* (the Windows ones are
      # .zip, the other three .tar.gz — extracted differently per OS below,
      # see that step's own comment on why); combined with LLAMA_CPP_RELEASE
      # below into the real filename. The ubuntu/macOS archives unpack into
      # one llama-<tag> subdirectory; the Windows one doesn't — found
      # dynamically below rather than hardcoding either layout.
      - name: Install llama-server
        shell: bash
        run: |
          set -euo pipefail
          asset="llama-${LLAMA_CPP_RELEASE}-bin-${{ matrix.llama-asset }}"
          # $HOME, not $RUNNER_TEMP: on Windows the latter is a native
          # `D:\a\_temp`-style path, and Git Bash's tar.exe (bsdtar) reads
          # the drive letter's colon as its own old rmt "host:path" remote-
          # archive syntax instead ("tar: Cannot connect to D: resolve
          # failed") — confirmed against a real windows-2025 run. $HOME is
          # already the plain POSIX-style path (`/c/Users/...`) Git Bash
          # itself uses throughout, on every OS this runs on.
          #
          # The local filename keeps $asset's own extension (not a fixed
          # generic name) — confirmed directly against a real windows-2025
          # run that Expand-Archive (see below) determines archive format
          # purely from the filename extension, unlike tar/file, which
          # sniff actual file content: an extension-less name downloaded
          # and byte-for-byte verified as a real zip still got "is not a
          # supported archive file format" from it.
          archive="$HOME/$asset"
          # --retry 16, not 5: confirmed on real ubuntu-24.04 and
          # windows-2025 runs that this specific download (GitHub's
          # release-assets CDN, not this repo's own code) can 503/"Empty
          # reply from server" for longer than curl's default exponential
          # backoff burns through 5 retries in (~30s total) — every attempt
          # failing without ever reaching a working response. More retries
          # (same exponential backoff, just more of it) rides out a longer
          # CDN blip while still eventually giving up if the asset is
          # genuinely gone.
          curl -fsSL --retry 16 --retry-all-errors -o "$archive" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_RELEASE}/${asset}"
          dir="$HOME/llama-cpp"
          mkdir -p "$dir"
          # Windows needs Expand-Archive, not tar -xf: confirmed against a
          # real windows-2025 run that the .zip downloads correctly (right
          # size, and `file` agrees it's a genuine zip) but Git for
          # Windows' bundled tar.exe (bsdtar) still rejects it outright
          # ("This does not look like a tar archive") — that build simply
          # doesn't support the zip format tar/find/cargo's own automatic
          # POSIX<->Windows path translation would otherwise make this a
          # non-issue for. macOS's and Linux's own tar (bsdtar and GNU tar,
          # respectively) both handle their own .tar.gz asset here fine.
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command \
              "Expand-Archive -LiteralPath '$(cygpath -w "$archive")' -DestinationPath '$(cygpath -w "$dir")' -Force"
          else
            tar -xf "$archive" -C "$dir"
          fi
          # Exact names only (not a `llama-server*` glob): the Windows
          # archive also ships a sibling llama-server-impl.dll, which
          # a wildcard would just as happily match first.
          bin=$(find "$dir" -type f \( -iname 'llama-server' -o -iname 'llama-server.exe' \) | head -n1)
          bindir=$(dirname "$bin")
          # $GITHUB_PATH crosses out of this bash step into whatever shell
          # later steps use (pwsh by default on Windows) — which, unlike
          # tar/find/cargo right above, doesn't go through Git Bash's own
          # automatic POSIX<->Windows path translation. A bare Git-Bash
          # path (`/c/Users/...`) written here would be silently useless
          # PATH-wise to that pwsh-run cargo/cargo-test's own child-process
          # spawn, so it's converted to the native `C:\Users\...` form
          # cygpath (bundled with Git for Windows) exists specifically for.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cygpath -w "$bindir" >> "$GITHUB_PATH"
          else
            echo "$bindir" >> "$GITHUB_PATH"
          fi
          # Only Linux needs this: llama-server's shared libraries sit
          # right next to it either way, but macOS's build resolves those
          # via @rpath/@loader_path and Windows' via the same-directory DLL
          # search every EXE already gets for free — neither needs (nor,
          # for DYLD_LIBRARY_PATH under macOS's hardened runtime, reliably
          # even honors) an extra library-search env var the way Linux's
          # dynamic linker does.
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "LD_LIBRARY_PATH=$bindir" >> "$GITHUB_ENV"
          fi

      # --target: matches the build job's own invocation (every one of
      # these is a native build, but explicit --target keeps the output
      # path/build-plan identical to that job's, rather than relying on
      # implicit host-target resolution). matrix.feature-flags is empty
      # for the docker entries (its default) and
      # "--no-default-features --features podman" for the two podman ones
      # — mirrors the `build` job's own separate "Build (podman backend)"
      # step, just reused here as a matrix dimension instead of a second
      # step, since this job needs the resulting binary under test either
      # way, not just a successful compile.
      - name: Build llmman
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.feature-flags }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # LLAMA_ARG_N_GPU_LAYERS=0 on macOS only: llama-server reads this
      # itself (it's the env form of its own --gpu-layers flag), and this
      # process's environment reaches the llama-server subprocess
      # cmd::serve spawns several layers down (llmman launch -> llmman
      # serve -> llama-server, each just inheriting the parent's env by
      # default) without llmman itself needing any change. Root-caused via
      # the new serve.log diagnostic against a real macOS run: this
      # specific pinned llama.cpp release's Metal backend cannot actually
      # run qwen3.5's Gated Delta Net / Flash Attention ops at all ("...
      # assigned to device MTL0 but ... is assigned to device CPU (usually
      # due to missing support)" — logged for both, immediately followed
      # by thousands of "ggml_metal_buffer_get_id: error: tensor '(view)'
      # buffer is nil"), and did in fact crash outright under a real
      # Claude Code prompt's actual size, not this suite's own tiny one —
      # a real, pre-existing llama.cpp/Metal gap for this specific model
      # architecture, not anything about llmman's own code, so forcing
      # pure CPU inference is scoped to this one test's environment,
      # not any change to how llmman itself launches llama-server for
      # real users' models (the overwhelming majority of which have no
      # such issue and would lose real Metal acceleration for nothing).
      #
      # Set via a separate, macOS-only step into $GITHUB_ENV rather than
      # this step's own `env:` (confirmed broken on a real
      # x86_64-unknown-linux-gnu run: llama-server treats even an *empty*
      # value as present and tries to parse it as an integer regardless —
      # "error while handling environment variable
      # \"LLAMA_ARG_N_GPU_LAYERS\": stoi") — or inline in this step's own
      # script with `shell: bash` (confirmed broken on a real
      # aarch64-pc-windows-msvc run a different way: forcing bash here
      # reorders PATH enough that rustc's link.exe resolves to Git for
      # Windows' own unrelated /usr/bin/link.exe — a hardlink-creation
      # utility that happens to share the name — instead of MSVC's
      # linker). A step gated on `if:` so it only even runs on macOS,
      # writing to $GITHUB_ENV, avoids both: every other platform's
      # environment and shell for the actual test step below stays
      # completely untouched.
      - name: Force CPU-only llama-server (macOS only)
        if: matrix.target == 'aarch64-apple-darwin'
        run: echo "LLAMA_ARG_N_GPU_LAYERS=0" >> "$GITHUB_ENV"

      # --target: for the same reason as the Build llmman step above —
      # and RUSTFLAGS needs repeating here too, not just there: this step
      # compiles its own separate test binary (tests/launch_e2e.rs), which
      # links against the exact same Go-shim-produced llmman_shim.lib the
      # main binary does, and hit that same LNK1223 lld-link exists to
      # avoid (see the `build` job's own comment) the first several times
      # this job's Windows entry ran — root-caused to exactly this: the
      # env was present on the Build llmman step above, but this step
      # never inherits another step's `env:` block, and never had its own.
      # matrix.feature-flags: same reasoning as the Build llmman step —
      # this test binary must link against the same backend the one built
      # above did, or the two podman entries would silently test a docker-
      # backed binary instead.
      - name: cargo test --test launch_e2e
        run: cargo test --release --target ${{ matrix.target }} ${{ matrix.feature-flags }} --test launch_e2e -- --test-threads=1 --nocapture
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # `llmman serve`'s own stdout/stderr never reach the test's own logs
      # above at all — see daemon::ensure_server's doc comment on why it's
      # detached and redirected to this file instead. A real macOS run
      # failed with the daemon returning a stale port for an already-
      # loaded model ("Connection refused" — the process backing it must
      # have exited without cmd::serve's own `running` map being told),
      # and this file is the only place that could show why (e.g. an
      # unexpected daemon restart, a crashed llama-server, ...) — always
      # run (not just on failure) since a *passing* run's log is useful
      # comparison context for a failing one on another platform/run.
      - name: Show llmman serve.log (diagnostic)
        if: always()
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            log="$LOCALAPPDATA/llmman/serve.log"
          else
            log="$HOME/.local/share/llmman/serve.log"
          fi
          if [ -f "$log" ]; then
            echo "--- $log ---"
            cat "$log"
          else
            echo "no serve.log found at $log"
          fi

      # ── Diagnostic: partial blob sizes on a failed pull ──────────────────
      # TEMPORARY — investigating the podman e2e job's real pull taking
      # far longer than expected. serve.log's own bar-rendering output
      # (mpb, above) tells us nothing useful when redirected to a plain
      # file rather than a real TTY, so this exists purely to answer one
      # question directly: at failure time, is the target blob sitting at
      # 0 bytes (a true stall — the new watchdog in backend_podman.go
      # should already prevent this) or some large-but-incomplete size
      # (genuinely slow/throttled network, not a stall at all)?
      - name: Show partial blob sizes (diagnostic, podman only)
        if: always() && matrix.backend == 'podman'
        shell: bash
        run: |
          dir="$HOME/.local/share/llmman/store/blobs/sha256"
          if [ -d "$dir" ]; then
            echo "--- $dir ---"
            ls -la "$dir"
          else
            echo "no blobs dir found at $dir"
          fi

  # --------------------------------------------------------------------------
  # Release: a GitHub Release per commit on main (llama.cpp-style b<N>
  # tags) plus proper versioned releases on v* tag pushes
  # --------------------------------------------------------------------------
  release:
    name: Release
    needs: build
    runs-on: ubuntu-24.04
    # Two release channels, both attaching one binary per matrix.target
    # (see the build job above — this is where "all the platforms
    # llama.app does" is actually decided, not here):
    #   - a real v* tag push  -> a proper versioned release, tag as-is.
    #   - any other push to main -> one release *per commit*, tagged
    #     b<N> where N is `git rev-list --count HEAD` — exactly
    #     llama.cpp's scheme (see its .github/actions/get-tag-name).
    #     Each is a regular (non-prerelease) release, so `curl
    #     install.sh | sh` (which defaults to /releases/latest/download/,
    #     see install.sh/install.ps1) always resolves to the newest
    #     commit's binaries, and older builds stay downloadable forever
    #     by tag instead of being overwritten.
    # PRs never reach this job at all (github.event_name == 'pull_request'
    # is excluded by construction: neither condition below matches it).
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 — the b<N> tag below is the full commit count,
      # which a shallow default clone can't compute. Checkout comes
      # before download-artifact: it cleans the workspace, so the other
      # order would delete dist/ again.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: llmman-docker-*
          merge-multiple: false

      - name: Rename binaries for release
        shell: bash
        run: |
          cd dist
          for dir in */; do
            target="${dir%/}"          # e.g. llmman-docker-x86_64-unknown-linux-gnu
            triple="${target#llmman-docker-}"
            if [ -f "${dir}llmman.exe" ]; then
              cp "${dir}llmman.exe" "llmman-${triple}.exe"
            else
              cp "${dir}llmman" "llmman-${triple}"
            fi
          done

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=b$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name }}
          body: ${{ github.event.head_commit.message }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/llmman-*
