name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

# Workflow-wide default: read-only. Every job here only needs to check
# out and build/test the repo except `release`, which needs to create a
# GitHub Release — that one job overrides this with its own
# `permissions: contents: write` (see the release job below) rather than
# every job inheriting broad default repo permissions for no reason.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The single place to bump when a newer llama.cpp release is needed —
  # every matrix.llama-asset entry below (e2e job) is just this release's
  # OS/arch-specific asset suffix (e.g. "ubuntu-x64.tar.gz"), combined
  # with this value at the "Install llama-server" step's own point of use
  # ("llama-${LLAMA_CPP_RELEASE}-bin-${{ matrix.llama-asset }}") rather
  # than each duplicating the full "llama-<release>-bin-..." filename
  # independently.
  LLAMA_CPP_RELEASE: b10293
  # vLLM version the e2e job's "Install vLLM (e2e)" step installs, for
  # vllm-plugin/tests/test_e2e.py's real `vllm serve` test.
  VLLM_VERSION: "0.27.1"
  # vllm-metal (github.com/vllm-project/vllm-metal), macOS's Metal-GPU
  # vLLM platform below, has no stable release channel — only several-
  # a-day nightlies — so this pins one verified build instead of
  # floating on "latest" in a release-gating job. Bump deliberately.
  VLLM_METAL_VERSION: "0.3.0.dev20260825040033"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ──────────────────────────────────────────────────
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            go-os: linux
            binary: llmman

          # ── Linux aarch64 ─────────────────────────────────────────────────
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            go-os: linux
            binary: llmman

          # ── macOS aarch64 (Apple Silicon) ─────────────────────────────────
          - target: aarch64-apple-darwin
            runner: macos-15
            go-os: darwin
            binary: llmman

          # ── Windows x86_64 ────────────────────────────────────────────────
          # lld-link is used instead of MSVC link.exe: it accepts clang's
          # .pdata format (fixing LNK1223) and GNU ar archives (fixing LNK4003).
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            go-os: windows
            binary: llmman.exe
            msvc-arch: amd64
            rustflags: "-C linker=lld-link"

          # ── Windows aarch64 ───────────────────────────────────────────────
          # ARM64 uses the MSVC-native link.exe (put first in PATH by
          # ilammy/msvc-dev-cmd) rather than lld-link: the lld-link in
          # C:\Program Files\LLVM\bin on the ARM64 runner is an x86_64
          # binary running under emulation; it opens ARM64 archives but
          # silently ignores ARM64 COFF objects (machine type mismatch),
          # reporting every CGO export as an undefined symbol.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            go-os: windows
            binary: llmman.exe
            msvc-arch: arm64
            rustflags: ""

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # ── Go toolchain ──────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-shim/go.sum

      # ── Rust toolchain ────────────────────────────────────────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.target }}

      # ── Windows: set up MSVC with the correct target architecture ─────────
      # msvc-arch is explicit in the matrix so the ARM64 runner gets the ARM64
      # toolchain rather than the default x64, which would cause the wrong
      # assembler to be used when CGO compiles Go's ARM64 runtime stubs.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.msvc-arch }}

      # ── Linux: C compiler (always needed for CGO) ─────────────────────────
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc

      # ── Diagnostics: show which C/linker tools will be used (Windows) ───────
      - name: Show Windows toolchain info
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== clang ===" ; where.exe clang ; clang --version 2>&1 | Select-Object -First 1
          Write-Host "=== lld-link ===" ; where.exe lld-link 2>&1 ; (Get-Command lld-link -ErrorAction SilentlyContinue)?.Source
          Write-Host "=== link ===" ; where.exe link 2>&1 | Select-Object -First 1

      # ── Build (Docker backend, default) ───────────────────────────────────
      - name: Build (docker backend)
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # ── Build (Podman backend) ────────────────────────────────────────────
      # Skipped on Windows: containers/image has no Windows support.
      - name: Build (podman backend)
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features podman
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # ── Diagnostics: inspect the Go shim library on Windows ARM64 ───────────
      - name: Inspect shim library (Windows aarch64)
        if: always() && matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $lib = Get-ChildItem -Recurse -Path "target" -Filter "llmman_shim.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($lib) {
            Write-Host "Found: $($lib.FullName) ($($lib.Length) bytes)"
            dumpbin /HEADERS "$($lib.FullName)" 2>&1 | Select-Object -First 20
            dumpbin /EXPORTS "$($lib.FullName)" 2>&1 | Select-String "llmman"
          } else {
            Write-Host "llmman_shim.lib NOT FOUND"
          }

      # ── Upload artefacts ──────────────────────────────────────────────────
      - name: Upload binary (docker)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llmman-docker-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Unit tests: every #[cfg(test)] module under src/ (`cargo test --bin`,
  # since this crate has no lib target — see Cargo.toml). These are pure-
  # Rust logic tests with no OS-specific behavior, but the crate itself
  # still links the Go shim via CGO, so a target-specific toolchain issue
  # (the exact kind the `build`/`e2e` jobs' own git history is full of —
  # lld-link vs MSVC link.exe, msvc-arch, ...) could just as easily break
  # `cargo test` as `cargo build`. Mirrors the `build` job's own 5-target
  # matrix exactly for that reason, rather than assuming Linux x86_64 is
  # representative of the other four.
  #
  # `cargo fmt --check` also lives here rather than in its own job:
  # formatting is platform-independent, so it only runs once, on the
  # Linux x86_64 leg (matrix.check-fmt below), instead of duplicating the
  # same check across all five targets.
  # --------------------------------------------------------------------------
  test:
    name: Unit tests (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ──────────────────────────────────────────────────
          # check-fmt: true — this is the one leg that also runs
          # `cargo fmt --check` (see the job's own comment above on why
          # only here).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            go-os: linux
            check-fmt: true

          # ── Linux aarch64 ─────────────────────────────────────────────────
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            go-os: linux

          # ── macOS aarch64 (Apple Silicon) ─────────────────────────────────
          - target: aarch64-apple-darwin
            runner: macos-15
            go-os: darwin

          # ── Windows x86_64 ────────────────────────────────────────────────
          # lld-link, not MSVC link.exe — see the `build` job's own comment
          # on why (same CGO-produced-object-format issue, native build or
          # not).
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            go-os: windows
            msvc-arch: amd64
            rustflags: "-C linker=lld-link"

          # ── Windows aarch64 ───────────────────────────────────────────────
          # rustflags empty (MSVC-native link.exe, not lld-link) — see the
          # `build` job's own comment on why this one architecture is the
          # opposite of the x86_64 Windows entry just above.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            go-os: windows
            msvc-arch: arm64
            rustflags: ""

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-shim/go.sum

      # targets: matches the build job's own Set up Rust step — needed
      # there for genuinely cross-compiled targets, harmless here where
      # every target is actually native. components: rustfmt is only
      # actually needed on the check-fmt leg (see this job's own comment
      # above), but dtolnay/rust-toolchain accepts an empty components
      # list fine on every other leg, so this stays a single step rather
      # than a second, conditional "Set up Rust" step.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}
          components: ${{ matrix.check-fmt && 'rustfmt' || '' }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: test-${{ matrix.target }}

      # ── Windows: set up MSVC (needed for CGO, same as the `build` job) ────
      # arch: matrix-driven (not a hardcoded amd64) — the ARM64 runner
      # needs the ARM64 toolchain, or CGO compiling Go's ARM64 runtime
      # stubs would use the wrong assembler (see the `build` job's own
      # comment on its identical msvc-arch matrix field).
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.msvc-arch }}

      # ── Linux: C compiler (always needed for CGO). macOS/Windows need
      # neither: Xcode's command-line tools already provide a C compiler
      # on the macOS runner image, and Windows' MSVC setup above covers it.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc

      # Only runs on the check-fmt leg (Linux x86_64) — see this job's
      # own comment above on why formatting is checked once rather than
      # once per matrix entry.
      - name: cargo fmt --check
        if: matrix.check-fmt
        run: cargo fmt --all -- --check

      # --target: matches the build job's own invocation (every one of
      # these is a native build, but explicit --target keeps the output
      # path/build-plan identical to that job's). RUSTFLAGS is needed here
      # too, not just on a separate build step — see the e2e job's own
      # comment on cargo test compiling its own separate test binary,
      # which links against the same Go-shim-produced llmman_shim.lib the
      # main binary does and hit the exact same lld-link requirement.
      - name: cargo test --bin llmman
        run: cargo test --release --target ${{ matrix.target }} --bin llmman
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

  # --------------------------------------------------------------------------
  # E2E: `llmman launch <claude|opencode|codex|hermes|openclaw> --model
  # qwen3.5:0.8b` (tests/launch_e2e.rs) against a real `llmman serve`, a
  # real pulled model, a real llama-server, and the real third-party CLIs
  # — not mocks. Mirrors the `build` job's own 5-target matrix exactly
  # (same runners, same msvc-arch/rustflags choices), so the launch/env/
  # config plumbing this actually exercises gets checked on every
  # platform/architecture llmman ships a binary for, not just a subset.
  #
  # Also runs vllm-plugin/tests/test_e2e.py (Linux x86_64/aarch64 and
  # macOS aarch64, both `matrix.backend` entries) against this job's own
  # installed `llmman` binary and a real `vllm serve` — CPU-only on
  # Linux, Metal-GPU-backed (via vllm-metal) on macOS.
  #
  # On the two macOS aarch64 legs (`matrix.backend` docker and podman —
  # see this job's own matrix below; "backend" there is the OCI-transport
  # Cargo feature `llmman` itself was built with, unrelated to how a
  # model gets served) `tests/launch_e2e.rs`'s own
  # `serve_mlx_safetensors_model` test additionally pulls and serves a
  # real safetensors model via `llmman serve`'s new, separate
  # `mlx_lm.server` backend (see cmd::serve::use_mlx_for_safetensors) —
  # not vllm-metal above, a different plugin (Metal GPU support bolted
  # onto `vllm serve` itself) this job's own vllm-plugin steps already
  # cover independently — the only two matrix entries where "Install
  # mlx-lm (macOS arm64, e2e)" below actually installs it; every other
  # entry's copy of that same test skips itself instead (mlx-lm has no
  # non-Apple-Silicon build to test against).
  # --------------------------------------------------------------------------
  e2e:
    name: E2E (launch claude/opencode/codex/hermes/openclaw, vllm-plugin, mlx) — ${{ matrix.target }} (${{ matrix.backend }})
    runs-on: ${{ matrix.runner }}
    # These take a long time (see the timeout-minutes comment below), so
    # they're skipped on pull_request entirely and only run on the two
    # push events that can actually lead to a release: a push to main
    # itself (the per-commit b<N> release channel) and a v* tag push (the
    # versioned release channel) — see the `release` job's own `needs`,
    # which now includes this job for exactly that reason, and its own
    # identical two-channel `if:` condition below.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # 5 tests run serialized (--test-threads=1 + lock_serial()), so the
    # worst case sums all 5's own retry budgets: MAX_ATTEMPTS * TIMEOUT
    # (3 * 600s = 30 min) each — a timeout itself never retries (see
    # launch_and_assert's own doc comment), so 30 min/test is only hit if
    # every attempt fails via a missing "pong" instead. Plus warm_model()'s
    # own separate TIMEOUT budget (10 min), paid at most once across all
    # tests (guarded by WARM's own Once). 5*30 + 10 = 160 min; 180 leaves
    # headroom on top of that for setup/build overhead (5-8 min on
    # Windows). Exhausting every attempt doesn't fail this job either way
    # (see launch_and_assert's own doc comment) — a run can still
    # legitimately take this long in wall-clock time before giving up.
    #
    # +90 on top of that 180 (270 total) for the vllm-plugin steps'
    # own per-step budgets below: up to 60 min for "Install vLLM (e2e)"
    # (wheel downloads, but a slow/retried one on a bad connection) plus
    # up to 30 min for "pytest -m e2e (vllm-plugin)".
    #
    # +10 more (280 total) for `serve_mlx_safetensors_model`'s own single
    # TIMEOUT budget (10 min, same 600s as warm_model's) — it doesn't go
    # through launch_and_assert's retry loop at all (a real failure there
    # is always a deterministic llmman bug worth failing loudly on, not
    # small-model sampling variance), so unlike the 5 launch tests above
    # it never multiplies by MAX_ATTEMPTS.
    timeout-minutes: 280
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 (docker backend) ────────────────────────────────
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            go-os: linux
            llama-asset: ubuntu-x64.tar.gz
            backend: docker
            feature-flags: ""

          # ── Linux aarch64 (docker backend) ───────────────────────────────
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            go-os: linux
            llama-asset: ubuntu-arm64.tar.gz
            backend: docker
            feature-flags: ""

          # ── Linux x86_64 (podman backend) ────────────────────────────────
          # Same runner/llama-asset as the docker entry above, just linked
          # against go-shim/backend_podman.go (go.podman.io/image) instead
          # of go-shim/backend_docker.go — this is the only place that
          # backend's actual pull/push code path gets exercised end-to-end
          # against a real registry; the `test` job's own unit tests never
          # touch the ffi::* boundary that differs between backends, and
          # the `build` job only compiles this backend, it doesn't run it.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            go-os: linux
            llama-asset: ubuntu-x64.tar.gz
            backend: podman
            feature-flags: "--no-default-features --features podman"

          # ── Linux aarch64 (podman backend) ───────────────────────────────
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            go-os: linux
            llama-asset: ubuntu-arm64.tar.gz
            backend: podman
            feature-flags: "--no-default-features --features podman"

          # ── macOS aarch64 (Apple Silicon, docker backend) ────────────────
          - target: aarch64-apple-darwin
            runner: macos-15
            go-os: darwin
            llama-asset: macos-arm64.tar.gz
            backend: docker
            feature-flags: ""

          # ── macOS aarch64 (Apple Silicon, podman backend) ────────────────
          # Same reasoning as the Linux podman entries above; `build`
          # already compiles this backend for macOS, but nothing
          # previously ran it against a real registry there.
          - target: aarch64-apple-darwin
            runner: macos-15
            go-os: darwin
            llama-asset: macos-arm64.tar.gz
            backend: podman
            feature-flags: "--no-default-features --features podman"

          # ── Windows x86_64 (docker backend) ──────────────────────────────
          # lld-link, not MSVC link.exe — see the `build` job's own comment
          # on why (same CGO-produced-object-format issue, native build or
          # not). No podman entry: containers/image has no Windows support
          # (see the `build` job's own comment on its identical exclusion).
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            go-os: windows
            llama-asset: win-cpu-x64.zip
            msvc-arch: amd64
            rustflags: "-C linker=lld-link"
            backend: docker
            feature-flags: ""

          # ── Windows aarch64 (docker backend) ─────────────────────────────
          # rustflags empty (MSVC-native link.exe, not lld-link) — see the
          # `build` job's own comment on why this one architecture is the
          # opposite of the x86_64 Windows entry just above.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            go-os: windows
            llama-asset: win-cpu-arm64.zip
            msvc-arch: arm64
            rustflags: ""
            backend: docker
            feature-flags: ""

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-shim/go.sum

      # targets: matches the build job's own Set up Rust step — needed
      # there for genuinely cross-compiled targets, harmless here where
      # every target is actually native.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          # backend, not just target: the docker/podman entries sharing a
          # target build with different --features, and Cargo's target dir
          # doesn't itself key build artefacts by feature set — an
          # unqualified key here would have them fight over (and keep
          # invalidating) the same cache entry.
          key: e2e-${{ matrix.target }}-${{ matrix.backend }}

      # ── Windows: set up MSVC (needed for CGO, same as the `build` job) ────
      # arch: matrix-driven (not a hardcoded amd64) — the ARM64 runner
      # needs the ARM64 toolchain, or CGO compiling Go's ARM64 runtime
      # stubs would use the wrong assembler (see the `build` job's own
      # comment on its identical msvc-arch matrix field).
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.msvc-arch }}

      # ── Linux: C compiler (always needed for CGO) + llama-server's own
      # runtime shared-library deps. macOS/Windows need neither: Xcode's
      # command-line tools already provide a C compiler on the macOS
      # runner image, and both platforms' llama-server release archives
      # are fully self-contained (verified via `strings`/load-command
      # inspection — no external libomp/libcurl reference either way).
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgomp1 libcurl4

      # ── Node.js (for the claude/opencode/codex CLIs under test) ────────────
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # `shell: bash` (not the Windows default of `pwsh`) for consistent
      # multi-line/array syntax; ubuntu/macOS already default to bash.
      #
      # Unlike hermes/mlx_lm.server (legitimately missing on some
      # platforms), these four are plain npm packages expected to work
      # everywhere — so install_cli fails the job, rather than letting
      # tests/launch_e2e.rs's on_path check silently skip, when one never
      # becomes a working binary.
      #
      # install_cli also verifies with `<bin> --version`, not just a
      # bare `npm install -g`: CI 33006723521 saw `npm install -g
      # @openai/codex` exit 0 while the `codex` it produced failed every
      # invocation with "Missing optional dependency
      # @openai/codex-darwin-arm64" — optionalDependencies working as
      # designed (npm tolerates one failed platform-tarball fetch, here
      # a registry blip, instead of failing the install), just not
      # detectable by a mere on_path/PATH check. Retrying rides that out.
      - name: Install integration CLIs (claude, opencode, codex, openclaw)
        shell: bash
        run: |
          failed_clis=()

          install_cli() {
            local install_spec="$1" pkg_name="$2" bin="$3"
            local max_attempts=6
            for attempt in $(seq 1 "$max_attempts"); do
              if [ "$attempt" -gt 1 ]; then
                # Clear npm's cache so a corrupted/incomplete cached
                # response from the last attempt can't repeat itself.
                npm cache clean --force >/dev/null 2>&1 || true
              fi
              local next="retrying"
              [ "$attempt" -eq "$max_attempts" ] && next="giving up"
              if ! npm install -g "$install_spec"; then
                echo "::warning::$pkg_name install failed on ${{ runner.os }} (attempt $attempt/$max_attempts); $next"
              elif version_output=$("$bin" --version 2>&1); then
                return 0
              else
                echo "::warning::$pkg_name installed but \"$bin --version\" failed on ${{ runner.os }} (attempt $attempt/$max_attempts); $next — output: $version_output"
              fi
              # Exponential backoff: 1s, 2s, 4s, 8s, 16s.
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep "$((2 ** (attempt - 1)))"
              fi
            done
            echo "::error::$pkg_name never produced a working \"$bin\" on ${{ runner.os }} after $max_attempts attempts"
            failed_clis+=("$pkg_name")
          }

          install_cli "@anthropic-ai/claude-code" "@anthropic-ai/claude-code" "claude"
          install_cli "opencode-ai" "opencode-ai" "opencode"
          install_cli "@openai/codex" "@openai/codex" "codex"
          # Pinned (not @latest): tests/launch_e2e.rs's own openclaw
          # invocation was verified against this exact release — its
          # docs describe CLI commands/flags this build doesn't actually
          # have (see launch_and_assert_tolerating's own doc comment),
          # so an unpinned upgrade could silently break the same way
          # again with no warning here.
          install_cli "openclaw@2026.7.1-2" "openclaw" "openclaw"

          if [ "${#failed_clis[@]}" -gt 0 ]; then
            echo "::error::the following integration CLIs never became installable on ${{ runner.os }} after retries: ${failed_clis[*]}"
            exit 1
          fi

      # hermes has no npm package (install.sh/install.ps1 only, like
      # llmman's own install scripts) — --skip-setup skips its
      # interactive onboarding wizard, since tests/launch_e2e.rs's own
      # write_hermes_config already configures it non-interactively.
      # Adds ~/.local/bin to GITHUB_PATH since that's where install.sh
      # puts the binary and it isn't necessarily already on PATH here.
      - name: Install Hermes Agent (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-setup || echo "::warning::hermes install failed on ${{ runner.os }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Hermes Agent (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          & ([scriptblock]::Create((irm https://hermes-agent.nousresearch.com/install.ps1))) -SkipSetup

      # opencode installs its configured provider's npm package (here
      # @ai-sdk/openai-compatible — see launch::opencode_config) on demand
      # into ~/.config/opencode/node_modules the first time a fresh HOME
      # uses it. Pay that cost here, separately diagnosable, instead of
      # inside tests/launch_e2e.rs's own per-launch timeout, so a slow
      # first-time install there can't masquerade as a hung launch.
      #
      # The target baseURL is deliberately unreachable (this only needs to
      # trigger the provider package install, not a real response) — which
      # means this can *only* ever time out, never exit cleanly: opencode's
      # ai-sdk runtime retries a failed connection indefinitely rather than
      # giving up, so there's no successful exit code to wait for once the
      # (fast) npm install itself is done. `timeout` (not the job's own
      # timeout-minutes) enforces a much shorter cap so this doesn't waste
      # CI time being deliberately, permanently unreachable, and `|| true`
      # tolerates the resulting SIGTERM/failure. Also tolerates opencode
      # itself not being installed (see the step above) — `command -v`
      # guards against that rather than failing here instead.
      #
      # `--kill-after=10`: confirmed live on a real x86_64-windows-2025 run
      # that plain `timeout 45` (SIGTERM only) can leave this hanging far
      # past its own 45s cap — the whole job ran to its 45-*minute*
      # timeout-minutes instead and got force-cancelled. A Node process
      # deep in this ai-sdk runtime's own indefinite connection-retry loop
      # doesn't reliably act on SIGTERM promptly (a known Node.js/libuv
      # quirk: a blocking native socket call in flight isn't necessarily
      # interrupted by a signal the event loop hasn't gotten back to yet),
      # so nothing here otherwise ever escalates to a harder kill.
      # `--kill-after` sends SIGKILL 10s after the initial SIGTERM if the
      # process is still alive, guaranteeing this step can't hang
      # regardless of whether opencode's own process tree responds to
      # SIGTERM at all.
      - name: Warm up opencode's on-demand provider install
        shell: bash
        run: |
          export OPENCODE_CONFIG_CONTENT='{"$schema":"https://opencode.ai/config.json","provider":{"ollama":{"npm":"@ai-sdk/openai-compatible","name":"Ollama","options":{"baseURL":"http://127.0.0.1:1/v1"},"models":{"warmup":{"name":"warmup"}}}},"model":"ollama/warmup"}'
          command -v opencode >/dev/null && timeout --kill-after=10 45 opencode run "hi" --print-logs --log-level DEBUG || true

      # ── llama-server (the inference backend `llmman serve` shells out to) ──
      # A prebuilt release straight from upstream llama.cpp, pinned so CI
      # doesn't silently pick up a build that changes behavior mid-flight;
      # bump the top-level env's LLAMA_CPP_RELEASE deliberately when a
      # newer one is needed — that one edit is enough, unlike the old
      # per-matrix-entry hardcoded filenames it replaced. `matrix.llama-asset`
      # is just this OS/arch's release asset *suffix* (the Windows ones are
      # .zip, the other three .tar.gz — extracted differently per OS below,
      # see that step's own comment on why); combined with LLAMA_CPP_RELEASE
      # below into the real filename. The ubuntu/macOS archives unpack into
      # one llama-<tag> subdirectory; the Windows one doesn't — found
      # dynamically below rather than hardcoding either layout.
      - name: Install llama-server
        shell: bash
        run: |
          set -euo pipefail
          asset="llama-${LLAMA_CPP_RELEASE}-bin-${{ matrix.llama-asset }}"
          # $HOME, not $RUNNER_TEMP: on Windows the latter is a native
          # `D:\a\_temp`-style path, and Git Bash's tar.exe (bsdtar) reads
          # the drive letter's colon as its own old rmt "host:path" remote-
          # archive syntax instead ("tar: Cannot connect to D: resolve
          # failed") — confirmed against a real windows-2025 run. $HOME is
          # already the plain POSIX-style path (`/c/Users/...`) Git Bash
          # itself uses throughout, on every OS this runs on.
          #
          # The local filename keeps $asset's own extension (not a fixed
          # generic name) — confirmed directly against a real windows-2025
          # run that Expand-Archive (see below) determines archive format
          # purely from the filename extension, unlike tar/file, which
          # sniff actual file content: an extension-less name downloaded
          # and byte-for-byte verified as a real zip still got "is not a
          # supported archive file format" from it.
          archive="$HOME/$asset"
          # --retry 16, not 5: confirmed on real ubuntu-24.04 and
          # windows-2025 runs that this specific download (GitHub's
          # release-assets CDN, not this repo's own code) can 503/"Empty
          # reply from server" for longer than curl's default exponential
          # backoff burns through 5 retries in (~30s total) — every attempt
          # failing without ever reaching a working response. More retries
          # (same exponential backoff, just more of it) rides out a longer
          # CDN blip while still eventually giving up if the asset is
          # genuinely gone.
          curl -fsSL --retry 16 --retry-all-errors -o "$archive" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_RELEASE}/${asset}"
          dir="$HOME/llama-cpp"
          mkdir -p "$dir"
          # Windows needs Expand-Archive, not tar -xf: confirmed against a
          # real windows-2025 run that the .zip downloads correctly (right
          # size, and `file` agrees it's a genuine zip) but Git for
          # Windows' bundled tar.exe (bsdtar) still rejects it outright
          # ("This does not look like a tar archive") — that build simply
          # doesn't support the zip format tar/find/cargo's own automatic
          # POSIX<->Windows path translation would otherwise make this a
          # non-issue for. macOS's and Linux's own tar (bsdtar and GNU tar,
          # respectively) both handle their own .tar.gz asset here fine.
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command \
              "Expand-Archive -LiteralPath '$(cygpath -w "$archive")' -DestinationPath '$(cygpath -w "$dir")' -Force"
          else
            tar -xf "$archive" -C "$dir"
          fi
          # Exact names only (not a `llama-server*` glob): the Windows
          # archive also ships a sibling llama-server-impl.dll, which
          # a wildcard would just as happily match first.
          bin=$(find "$dir" -type f \( -iname 'llama-server' -o -iname 'llama-server.exe' \) | head -n1)
          bindir=$(dirname "$bin")
          # $GITHUB_PATH crosses out of this bash step into whatever shell
          # later steps use (pwsh by default on Windows) — which, unlike
          # tar/find/cargo right above, doesn't go through Git Bash's own
          # automatic POSIX<->Windows path translation. A bare Git-Bash
          # path (`/c/Users/...`) written here would be silently useless
          # PATH-wise to that pwsh-run cargo/cargo-test's own child-process
          # spawn, so it's converted to the native `C:\Users\...` form
          # cygpath (bundled with Git for Windows) exists specifically for.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cygpath -w "$bindir" >> "$GITHUB_PATH"
          else
            echo "$bindir" >> "$GITHUB_PATH"
          fi
          # Only Linux needs this: llama-server's shared libraries sit
          # right next to it either way, but macOS's build resolves those
          # via @rpath/@loader_path and Windows' via the same-directory DLL
          # search every EXE already gets for free — neither needs (nor,
          # for DYLD_LIBRARY_PATH under macOS's hardened runtime, reliably
          # even honors) an extra library-search env var the way Linux's
          # dynamic linker does.
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "LD_LIBRARY_PATH=$bindir" >> "$GITHUB_ENV"
          fi

      # --target: matches the build job's own invocation (every one of
      # these is a native build, but explicit --target keeps the output
      # path/build-plan identical to that job's, rather than relying on
      # implicit host-target resolution). matrix.feature-flags is empty
      # for the docker entries (its default) and
      # "--no-default-features --features podman" for the two podman ones
      # — mirrors the `build` job's own separate "Build (podman backend)"
      # step, just reused here as a matrix dimension instead of a second
      # step, since this job needs the resulting binary under test either
      # way, not just a successful compile.
      - name: Build llmman
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.feature-flags }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # ── Install llmman via the real install script ───────────────────────
      # Runs the actual install.sh (Unix) / install.ps1 (Windows) a real
      # user's `curl ... | sh` / `irm ... | iex` runs, pointed (via
      # LLMMAN_BASE_URL — an env override added to both scripts
      # specifically for this) at a throwaway local HTTP server serving
      # *this job's own* just-built binary from the step above, instead of
      # a real GitHub release: a release for a commit/PR still under test
      # wouldn't exist yet, and even on `main` a real release still lags
      # one full CI run behind whatever's actually being tested right now.
      # Every other part of the install — OS/arch detection, the download
      # itself, the `--version` smoke check, and the final
      # install-directory copy — runs completely unmodified, so this is a
      # real test of the install script's own logic, not a stand-in for
      # it. `tests/launch_e2e.rs` (next step) then runs the resulting
      # *installed* binary (via LLMMAN_E2E_BIN, set below) instead of the
      # one `cargo build` itself dropped in target/, so the whole e2e
      # suite ends up testing the same artifact a real install actually
      # produces.
      #
      # `shell: bash` throughout (including the Windows entries, same as
      # the "Install llama-server" step above): install.ps1 itself still
      # needs real PowerShell, invoked here as `pwsh -NoProfile -File`
      # from within this bash script — the same pattern that step already
      # uses for `powershell -NoProfile -Command` — rather than a second,
      # Windows-only `shell: pwsh` step, since everything else here (the
      # local server, the download readiness poll) is identical on every
      # OS.
      - name: Install llmman (via install script)
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset="llmman-$target.exe"
            bin="target/$target/release/llmman.exe"
          else
            asset="llmman-$target"
            bin="target/$target/release/llmman"
          fi

          # Mirrors the one path shape both scripts ever request
          # ("<base>/latest/download/<asset>" — neither script is given
          # LLMMAN_VERSION here, so both take their own "latest" branch),
          # so the download step below is exercising the exact same
          # URL-construction logic a real unpinned install does.
          release_dir="$RUNNER_TEMP/fake-releases/latest/download"
          mkdir -p "$release_dir"
          cp "$bin" "$release_dir/$asset"

          # A minimal static file server (plain Node http/fs — no npm
          # package fetch) standing in for GitHub's own release-asset
          # CDN. Node, not e.g. Python: every entry in this matrix already
          # has Node on PATH (set up above for the claude/opencode/codex
          # CLIs under test), so this adds no new dependency/toolchain,
          # unlike Python (present, but not guaranteed to be `python3` vs
          # `python` the same way across all five of this matrix's OSes).
          # A real HTTP round trip, not a file:// URL curl/Invoke-WebRequest
          # would also happily accept but a real install never goes
          # through.
          cat > "$RUNNER_TEMP/serve-release.js" <<'EOF'
          const http = require("http");
          const fs = require("fs");
          const path = require("path");
          const root = process.argv[2];
          const port = Number(process.argv[3]);
          http.createServer((req, res) => {
            const file = path.join(root, decodeURIComponent(req.url));
            fs.readFile(file, (err, data) => {
              if (err) { res.writeHead(404); res.end(); return; }
              res.writeHead(200);
              res.end(data);
            });
          }).listen(port, "127.0.0.1");
          EOF
          node "$RUNNER_TEMP/serve-release.js" "$RUNNER_TEMP/fake-releases" 8791 &
          server_pid=$!
          # This server only needs to live long enough for the install
          # below — killed at the end of this step either way (`trap ...
          # EXIT`, not a separate step) rather than left running for the
          # rest of the job for nothing.
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            curl -fsS "http://127.0.0.1:8791/latest/download/$asset" -o /dev/null 2>/dev/null && break
            sleep 0.2
          done

          export LLMMAN_BASE_URL="http://127.0.0.1:8791"
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -NoProfile -File install.ps1
            # cygpath -w, not a bare "$LOCALAPPDATA/..." concatenation:
            # this exact value is about to cross into $GITHUB_ENV for the
            # *next* step's own child process (tests/launch_e2e.rs's
            # `Command::new`) to spawn directly — a canonical
            # backslash-separated Windows path there is one less thing to
            # go wrong than relying on that consumer also tolerating
            # forward slashes.
            install_bin=$(cygpath -w "$LOCALAPPDATA/Microsoft/WindowsApps/llmman.exe")
          else
            sh install.sh
            install_bin="$HOME/.local/bin/llmman"
            # install.sh itself only prints instructions to add this to
            # PATH for *future* shell sessions (see its own PATH-check
            # branch) — added here too so any later step in this job that
            # just runs `llmman` bare (matching what a real post-install
            # shell would do) can.
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

          "$install_bin" --version
          echo "LLMMAN_E2E_BIN=$install_bin" >> "$GITHUB_ENV"

      # LLAMA_ARG_N_GPU_LAYERS=0 on macOS only: llama-server reads this
      # itself (it's the env form of its own --gpu-layers flag), and this
      # process's environment reaches the llama-server subprocess
      # cmd::serve spawns several layers down (llmman launch -> llmman
      # serve -> llama-server, each just inheriting the parent's env by
      # default) without llmman itself needing any change. Root-caused via
      # the new serve.log diagnostic against a real macOS run: this
      # specific pinned llama.cpp release's Metal backend cannot actually
      # run qwen3.5's Gated Delta Net / Flash Attention ops at all ("...
      # assigned to device MTL0 but ... is assigned to device CPU (usually
      # due to missing support)" — logged for both, immediately followed
      # by thousands of "ggml_metal_buffer_get_id: error: tensor '(view)'
      # buffer is nil"), and did in fact crash outright under a real
      # Claude Code prompt's actual size, not this suite's own tiny one —
      # a real, pre-existing llama.cpp/Metal gap for this specific model
      # architecture, not anything about llmman's own code, so forcing
      # pure CPU inference is scoped to this one test's environment,
      # not any change to how llmman itself launches llama-server for
      # real users' models (the overwhelming majority of which have no
      # such issue and would lose real Metal acceleration for nothing).
      #
      # Set via a separate, macOS-only step into $GITHUB_ENV rather than
      # this step's own `env:` (confirmed broken on a real
      # x86_64-unknown-linux-gnu run: llama-server treats even an *empty*
      # value as present and tries to parse it as an integer regardless —
      # "error while handling environment variable
      # \"LLAMA_ARG_N_GPU_LAYERS\": stoi") — or inline in this step's own
      # script with `shell: bash` (confirmed broken on a real
      # aarch64-pc-windows-msvc run a different way: forcing bash here
      # reorders PATH enough that rustc's link.exe resolves to Git for
      # Windows' own unrelated /usr/bin/link.exe — a hardlink-creation
      # utility that happens to share the name — instead of MSVC's
      # linker). A step gated on `if:` so it only even runs on macOS,
      # writing to $GITHUB_ENV, avoids both: every other platform's
      # environment and shell for the actual test step below stays
      # completely untouched.
      - name: Force CPU-only llama-server (macOS only)
        if: matrix.target == 'aarch64-apple-darwin'
        run: echo "LLAMA_ARG_N_GPU_LAYERS=0" >> "$GITHUB_ENV"

      # ── mlx-lm (macOS arm64 only) ─────────────────────────────────────────
      # Apple Silicon's own Metal-accelerated backend for safetensors
      # models (see cmd::serve::use_mlx_for_safetensors) — installed, and
      # its `mlx_lm.server` console script put on PATH, *before* "cargo
      # test --test launch_e2e" below spawns this job's one shared
      # `llmman serve` daemon (see tests/launch_e2e.rs's own module doc
      # comment on why every test in that file shares one daemon): PATH is
      # fixed at that daemon's own spawn time, like every other part of a
      # child process's inherited environment, so installing this any
      # later would leave the already-running daemon unable to find
      # `mlx_lm.server` for the rest of this job — installing it here,
      # before that daemon ever starts, is the only ordering that works.
      # A separate venv from vllm-plugin's own (set up further below, for
      # both Linux and macOS) rather than reusing it: that one doesn't
      # exist yet at this point in the job, and giving mlx-lm its own
      # keeps this step's ordering constraint independent of that one's.
      #
      # `serve_mlx_safetensors_model` (tests/launch_e2e.rs) is the only
      # test that actually needs this — every other one in that file
      # serves qwen3.5:0.8b (a GGUF model, llama-server's own territory,
      # never mlx's) — and, like every other prerequisite in that file,
      # skips itself (rather than failing) when `mlx_lm.server` isn't on
      # PATH, so this step is deliberately scoped to macOS arm64 only:
      # mlx-lm has no non-Apple-Silicon build to even attempt installing
      # elsewhere.
      - name: Set up Python (mlx e2e)
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install mlx-lm (macOS arm64, e2e)
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mlx-lm-venv"
          "$RUNNER_TEMP/mlx-lm-venv/bin/pip" install mlx-lm
          echo "$RUNNER_TEMP/mlx-lm-venv/bin" >> "$GITHUB_PATH"

      # --target: for the same reason as the Build llmman step above —
      # and RUSTFLAGS needs repeating here too, not just there: this step
      # compiles its own separate test binary (tests/launch_e2e.rs), which
      # links against the exact same Go-shim-produced llmman_shim.lib the
      # main binary does, and hit that same LNK1223 lld-link exists to
      # avoid (see the `build` job's own comment) the first several times
      # this job's Windows entry ran — root-caused to exactly this: the
      # env was present on the Build llmman step above, but this step
      # never inherits another step's `env:` block, and never had its own.
      # matrix.feature-flags: same reasoning as the Build llmman step —
      # this test binary must link against the same backend the one built
      # above did, or the two podman entries would silently test a docker-
      # backed binary instead.
      #
      # LLMMAN_E2E_BIN isn't set here — it doesn't need to be. The
      # "Install llmman (via install script)" step above already exported
      # it into $GITHUB_ENV, which every later step in this job (this one
      # included) inherits automatically; see tests/launch_e2e.rs's own
      # `llmman_bin` doc comment for what it's actually for: making this
      # whole suite launch the *installed* binary the step above produced,
      # not the one `cargo build`/this step's own compile drops in
      # target/ (which still happens regardless — env!("CARGO_BIN_EXE_llmman")
      # is a compile-time macro, and it's still that step's fallback for a
      # plain local `cargo test` run).
      - name: cargo test --test launch_e2e
        run: cargo test --release --target ${{ matrix.target }} ${{ matrix.feature-flags }} --test launch_e2e -- --test-threads=1 --nocapture
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # ── vllm-plugin e2e (Linux + macOS) ──────────────────────────────────
      # `vllm-plugin/tests/test_e2e.py` against this job's own installed
      # `llmman` binary and a real `vllm serve` — CPU-only on Linux,
      # Metal-GPU-backed (via vllm-metal) on macOS. Excludes Windows: no
      # vLLM CPU wheel/backend exists for it.
      #
      # Uses a venv, not the bare system python3 (Ubuntu 24.04's is PEP
      # 668-locked). Both vllm-plugin and vllm (next step) install into
      # this same venv so the plugin's entry point (see pyproject.toml)
      # is actually discoverable by the vllm process.
      - name: Set up Python (vllm-plugin e2e)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install vllm-plugin (e2e)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vllm-plugin-venv"
          "$RUNNER_TEMP/vllm-plugin-venv/bin/pip" install -e ./vllm-plugin pytest
          echo "$RUNNER_TEMP/vllm-plugin-venv/bin" >> "$GITHUB_PATH"

      # No GPU assumed on Linux, so that leg installs vLLM's CPU wheel,
      # not the default CUDA one. macOS installs that same upstream
      # "+cpu" wheel (a GitHub release asset since v0.26.0; PyPI still
      # has none) plus vllm-metal on top, which overrides vLLM's
      # CpuPlatform autodetection with a real Metal-GPU MetalPlatform via
      # its own `vllm.platform_plugins` entry point — building vLLM's
      # CPU backend from source on macOS instead (this job's prior
      # approach) hung forever inside its own CPU worker, regardless of
      # --dtype (see git history).
      # LD_PRELOAD (Linux x86_64 only): vLLM's CPU wheel needs Intel
      # OpenMP preloaded; located via a glob scoped to this venv.
      - name: Install vLLM (e2e)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/vllm-plugin-venv"

          if [ "${{ runner.os }}" = "macOS" ]; then
            "$venv/bin/pip" install \
              "https://github.com/vllm-project/vllm/releases/download/v${VLLM_VERSION}/vllm-${VLLM_VERSION}%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl"
            "$venv/bin/pip" install \
              "https://github.com/vllm-project/vllm-metal/releases/download/v${VLLM_METAL_VERSION}/vllm_metal-${VLLM_METAL_VERSION}-cp312-cp312-macosx_15_0_arm64.whl"
          else
            case "${{ matrix.target }}" in
              x86_64-*) arch=x86_64 ;;
              aarch64-*) arch=aarch64 ;;
              *) echo "unhandled target for vLLM CPU wheel: ${{ matrix.target }}" >&2; exit 1 ;;
            esac
            wheel="vllm-${VLLM_VERSION}+cpu-cp38-abi3-manylinux_2_34_${arch}.whl"
            "$venv/bin/pip" install \
              "https://github.com/vllm-project/vllm/releases/download/v${VLLM_VERSION}/$wheel" \
              --extra-index-url https://download.pytorch.org/whl/cpu

            if [ "$arch" = "x86_64" ]; then
              iomp=$("$venv/bin/python3" -c "import glob, sysconfig; m = glob.glob(sysconfig.get_paths()['purelib'] + '/**/libiomp5.so', recursive=True); print(m[0] if m else '')")
              if [ -n "$iomp" ]; then
                echo "LD_PRELOAD=$iomp" >> "$GITHUB_ENV"
              else
                echo "::warning::libiomp5.so not found under $venv; LD_PRELOAD not set for vLLM CPU (x86_64)"
              fi
            fi
          fi

      # LLMMAN_BIN isn't needed: `llmman` is already on PATH (added to
      # $GITHUB_PATH by "Install llmman (via install script)" above).
      - name: pytest -m e2e (vllm-plugin)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        timeout-minutes: 30
        run: pytest -m e2e -v
        working-directory: vllm-plugin

      # `llmman serve`'s own stdout/stderr never reach the test's own logs
      # above at all — see daemon::ensure_server's doc comment on why it's
      # detached and redirected to this file instead. A real macOS run
      # failed with the daemon returning a stale port for an already-
      # loaded model ("Connection refused" — the process backing it must
      # have exited without cmd::serve's own `running` map being told),
      # and this file is the only place that could show why (e.g. an
      # unexpected daemon restart, a crashed llama-server, ...) — always
      # run (not just on failure) since a *passing* run's log is useful
      # comparison context for a failing one on another platform/run.
      - name: Show llmman serve.log (diagnostic)
        if: always()
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            log="$LOCALAPPDATA/llmman/serve.log"
          else
            log="$HOME/.local/share/llmman/serve.log"
          fi
          if [ -f "$log" ]; then
            echo "--- $log ---"
            cat "$log"
          else
            echo "no serve.log found at $log"
          fi

      # ── Diagnostic: partial blob sizes on a failed pull ──────────────────
      # TEMPORARY — investigating the podman e2e job's real pull taking
      # far longer than expected. serve.log's own bar-rendering output
      # (mpb, above) tells us nothing useful when redirected to a plain
      # file rather than a real TTY, so this exists purely to answer one
      # question directly: at failure time, is the target blob sitting at
      # 0 bytes (a true stall — the new watchdog in backend_podman.go
      # should already prevent this) or some large-but-incomplete size
      # (genuinely slow/throttled network, not a stall at all)?
      - name: Show partial blob sizes (diagnostic, podman only)
        if: always() && matrix.backend == 'podman'
        shell: bash
        run: |
          dir="$HOME/.local/share/llmman/store/blobs/sha256"
          if [ -d "$dir" ]; then
            echo "--- $dir ---"
            ls -la "$dir"
          else
            echo "no blobs dir found at $dir"
          fi

  # --------------------------------------------------------------------------
  # Release: a GitHub Release per commit on main (llama.cpp-style b<N>
  # tags) plus proper versioned releases on v* tag pushes
  # --------------------------------------------------------------------------
  release:
    name: Release
    # All of build/test/e2e must be green before a release is cut — not
    # just build. (`cargo fmt --check` now runs as part of `test`'s own
    # check-fmt leg — see that job's own comment — so it's covered here
    # too without a separate `fmt` entry.) e2e itself only runs on the
    # same two push events this job's own `if:` below fires on (see e2e's
    # own `if:` comment), so this `needs` entry lines up with both the
    # main-push and v*-tag release channels without ever blocking on an
    # e2e run that was never going to happen for some other event (e.g. a
    # PR).
    needs: [build, test, e2e]
    runs-on: ubuntu-24.04
    # Two release channels, both attaching one binary per matrix.target
    # (see the build job above — this is where "all the platforms
    # llama.app does" is actually decided, not here):
    #   - a real v* tag push  -> a proper versioned release, tag as-is.
    #   - any other push to main -> one release *per commit*, tagged
    #     b<N> where N is `git rev-list --count HEAD` — exactly
    #     llama.cpp's scheme (see its .github/actions/get-tag-name).
    #     Each is a regular (non-prerelease) release, so `curl
    #     install.sh | sh` (which defaults to /releases/latest/download/,
    #     see install.sh/install.ps1) always resolves to the newest
    #     commit's binaries, and older builds stay downloadable forever
    #     by tag instead of being overwritten.
    # PRs never reach this job at all (github.event_name == 'pull_request'
    # is excluded by construction: neither condition below matches it).
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 — the b<N> tag below is the full commit count,
      # which a shallow default clone can't compute. Checkout comes
      # before download-artifact: it cleans the workspace, so the other
      # order would delete dist/ again.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: llmman-docker-*
          merge-multiple: false

      - name: Rename binaries for release
        shell: bash
        run: |
          cd dist
          for dir in */; do
            target="${dir%/}"          # e.g. llmman-docker-x86_64-unknown-linux-gnu
            triple="${target#llmman-docker-}"
            if [ -f "${dir}llmman.exe" ]; then
              cp "${dir}llmman.exe" "llmman-${triple}.exe"
            else
              cp "${dir}llmman" "llmman-${triple}"
            fi
          done

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=b$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        id: notes
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "$HEAD_COMMIT_MESSAGE" \
            | sed -E '/^[[:space:]]*(signed-off-by|co-authored-by):/Id' \
            | cat -s \
            | awk '
                { line[NR] = $0 }
                END {
                  last = NR
                  while (last > 0 && line[last] ~ /^[[:space:]]*-*[[:space:]]*$/) last--
                  for (i = 1; i <= last; i++) print line[i]
                }
              ' > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: dist/llmman-*
