<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>llmman</title>
  <link rel="icon" href="ui/manatee.png" type="image/png">
  <link rel="stylesheet" href="ui/vendor/xterm.css">
  <link rel="stylesheet" href="ui/app.css">
  <script>
    // Before first paint, so a dark theme never flashes light: the same
    // key settings.js writes.
    try {
      var t = JSON.parse(localStorage.getItem("llmman.settings") || "{}").theme;
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="sidebar-head">
      <a class="wordmark" href="#/" title="llmman">
        <img class="wordmark-mark" src="ui/manatee.png" alt="" aria-hidden="true">
        <span>llmman</span>
      </a>
      <button class="icon-btn" id="sidebar-close" title="Close sidebar" aria-label="Close sidebar">
        <svg viewBox="0 0 24 24"><use href="#i-panel"/></svg>
      </button>
    </div>

    <div class="mode-toggle" role="tablist" aria-label="Mode">
      <button role="tab" data-mode="chat" class="active" id="mode-chat" aria-selected="true" aria-controls="view-chat">Chat</button>
      <button role="tab" data-mode="shell" id="mode-shell" aria-selected="false" aria-controls="view-shell">Shell</button>
    </div>

    <button class="new-chat" id="new-chat">
      <span class="new-chat-plus"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg></span>
      <span>New chat</span>
    </button>

    <nav class="sidebar-nav">
      <a class="nav-item" href="#/" data-nav="chat">
        <svg viewBox="0 0 24 24"><use href="#i-chat"/></svg><span>Chats</span>
      </a>
      <a class="nav-item" href="#/models" data-nav="models">
        <svg viewBox="0 0 24 24"><use href="#i-cube"/></svg><span>Models</span>
      </a>
    </nav>

    <div class="recents">
      <div class="recents-label">Recents</div>
      <ul class="recent-list" id="recent-list"></ul>
      <div class="recents-empty" id="recents-empty">Your conversations will show up here.</div>
    </div>

    <div class="sidebar-foot">
      <button class="nav-item" id="settings-btn" type="button">
        <svg viewBox="0 0 24 24"><use href="#i-gear"/></svg><span>Settings</span>
      </button>
      <div class="daemon-line" id="daemon-line" title="The llmman serve this page is talking to">
        <span class="dot" id="daemon-dot"></span>
        <span id="daemon-text">connecting…</span>
      </div>
    </div>
  </aside>
  <div class="sidebar-scrim" id="sidebar-scrim" aria-hidden="true"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="sidebar-open" title="Open sidebar" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24"><use href="#i-panel"/></svg>
      </button>
      <div class="topbar-title" id="topbar-title"></div>
    </header>

    <!-- Chat -->
    <section class="view view-chat empty" id="view-chat" role="tabpanel">
      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-column">
          <div class="greeting" id="greeting">
            <img class="greeting-mark" src="ui/manatee.png" alt="" aria-hidden="true">
            <h1 id="greeting-text">How can I help you today?</h1>
          </div>
          <div class="messages" id="messages"></div>
          <div class="scroll-anchor" id="scroll-anchor"></div>
        </div>
      </div>

      <div class="composer-wrap">
        <div class="composer" id="composer">
          <!-- Pictures waiting to go with the next message. -->
          <div class="attachments hidden" id="attachments" aria-label="Attached images"></div>
          <input type="file" id="attach-input" accept="image/*" multiple hidden>
          <!-- Without a secure context the page cannot open a camera: the phone's camera app. -->
          <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
          <textarea id="prompt" rows="1" placeholder="How can I help you today?" aria-label="Message" autocomplete="off" spellcheck="true"></textarea>
          <div class="composer-row">
            <div class="composer-left">
              <button class="icon-btn" id="prompt-settings-btn" title="Chat settings" aria-label="Chat settings">
                <svg viewBox="0 0 24 24"><use href="#i-sliders"/></svg>
              </button>
              <!-- Chat models only. -->
              <button class="icon-btn chat-only" id="attach-btn" title="Attach images" aria-label="Attach images">
                <svg viewBox="0 0 24 24"><use href="#i-attach"/></svg>
              </button>
              <button class="icon-btn chat-only" id="camera-btn" title="Take a photo" aria-label="Take a photo">
                <svg viewBox="0 0 24 24"><use href="#i-camera"/></svg>
              </button>
              <button class="icon-btn toggle chat-only" id="search-btn" title="Search the web" aria-label="Search the web" aria-pressed="false">
                <svg viewBox="0 0 24 24"><use href="#i-globe"/></svg>
              </button>
              <button class="icon-btn toggle chat-only" id="think-btn" title="Deep thinking" aria-label="Deep thinking" aria-pressed="false">
                <svg viewBox="0 0 24 24"><use href="#i-bulb"/></svg>
              </button>
              <!-- With a media generation model: what the prompt becomes. -->
              <div class="kind-toggle hidden" id="media-kind" role="group" aria-label="Output">
                <button type="button" data-kind="image" aria-pressed="false" title="Generate an image">
                  <svg viewBox="0 0 24 24"><use href="#i-image"/></svg><span>Image</span>
                </button>
                <button type="button" data-kind="video" aria-pressed="false" title="Generate a video">
                  <svg viewBox="0 0 24 24"><use href="#i-video"/></svg><span>Video</span>
                </button>
                <button type="button" data-kind="audio" aria-pressed="false" title="Generate audio">
                  <svg viewBox="0 0 24 24"><use href="#i-audio"/></svg><span>Audio</span>
                </button>
              </div>
            </div>
            <div class="composer-right">
              <button class="icon-btn hidden" id="mic-btn" title="Dictate" aria-label="Dictate" aria-pressed="false">
                <svg viewBox="0 0 24 24"><use href="#i-mic"/></svg>
              </button>
              <button class="icon-btn toggle chat-only hidden" id="voice-btn" title="Voice mode: speak, and hear the reply" aria-label="Voice mode" aria-pressed="false">
                <svg viewBox="0 0 24 24"><use href="#i-headset"/></svg>
              </button>
              <button class="model-btn" id="model-btn" aria-haspopup="menu" aria-expanded="false">
                <span class="model-btn-name" id="model-btn-name">Choose a model</span>
                <svg viewBox="0 0 24 24" class="chev"><use href="#i-chevron"/></svg>
              </button>
              <button class="send-btn" id="send-btn" title="Send (Enter)" aria-label="Send" disabled>
                <svg viewBox="0 0 24 24" class="send-icon"><use href="#i-arrow-up"/></svg>
                <svg viewBox="0 0 24 24" class="stop-icon"><use href="#i-stop"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="composer-status" id="composer-status"></div>
      </div>

      <!-- Model picker popover -->
      <div class="popover model-menu hidden" id="model-menu" role="menu">
        <input class="menu-search" id="model-search" placeholder="Search models" autocomplete="off">
        <div class="menu-body" id="model-menu-body"></div>
        <div class="menu-foot">
          <button class="menu-foot-btn" id="pull-open">
            <svg viewBox="0 0 24 24"><use href="#i-download"/></svg><span>Pull a model…</span>
          </button>
          <button class="menu-foot-btn" id="models-refresh" title="Refresh">
            <svg viewBox="0 0 24 24"><use href="#i-refresh"/></svg><span>Refresh</span>
          </button>
        </div>
      </div>

      <!-- Chat settings popover; media fields with a generation model. -->
      <div class="popover prompt-settings hidden" id="prompt-settings">
        <div class="settings-chat" id="settings-chat">
          <label class="field">
            <span>System prompt</span>
            <textarea id="system-prompt" rows="4" placeholder="Optional instructions sent with every message in this conversation"></textarea>
          </label>
          <label class="field field-row">
            <span>Temperature</span>
            <input type="number" id="temperature" min="0" max="2" step="0.1" placeholder="model default">
          </label>
          <label class="field field-row">
            <span>Max tokens</span>
            <input type="number" id="max-tokens" min="1" step="1" placeholder="unlimited">
          </label>
          <label class="field field-row">
            <span>Thinking</span>
            <select id="thinking" title="How long a reasoning model thinks before it answers">
              <option value="">Model default</option>
              <option value="none">Off</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </label>
        </div>
        <div class="settings-media hidden" id="settings-media">
          <div class="field field-row media-visual" role="group" aria-labelledby="media-size-label">
            <span id="media-size-label">Size</span>
            <span class="size-pair">
              <input type="number" id="media-width" min="32" max="4096" step="32" placeholder="768" aria-label="Width">
              <span class="muted">×</span>
              <input type="number" id="media-height" min="32" max="4096" step="32" placeholder="512" aria-label="Height">
            </span>
          </div>
          <label class="field field-row media-timed">
            <span>Seconds</span>
            <input type="number" id="media-seconds" min="0.5" max="42" step="0.5" placeholder="model default">
          </label>
          <label class="field field-row">
            <span>Steps</span>
            <input type="number" id="media-steps" min="1" max="200" step="1" placeholder="model default">
          </label>
          <label class="field field-row">
            <span>Seed</span>
            <input type="number" id="media-seed" min="0" max="4294967295" step="1" placeholder="random">
          </label>
          <label class="field field-row">
            <span>Guidance</span>
            <input type="number" id="media-cfg" min="0" max="30" step="0.5" placeholder="model default">
          </label>
          <label class="field">
            <span>Negative prompt</span>
            <textarea id="media-negative" rows="2" placeholder="What to keep out (guidance above 1 applies it)"></textarea>
          </label>
        </div>
      </div>
    </section>

    <!-- Shell -->
    <!-- Models -->
    <section class="view view-models hidden" id="view-models" role="tabpanel">
      <div class="browser" id="mb">
        <aside class="browser-list">
          <div class="browser-search">
            <svg viewBox="0 0 24 24" class="browser-search-icon"><use href="#i-search"/></svg>
            <input id="mb-query" placeholder="Search Docker Hub and Hugging Face" autocomplete="off" spellcheck="false">
          </div>
          <div class="browser-tabs" id="mb-tabs" role="group" aria-label="Show">
            <button type="button" data-filter="all" class="active" aria-pressed="true">All</button>
            <button type="button" data-filter="docker" aria-pressed="false">Docker Hub</button>
            <button type="button" data-filter="hf" aria-pressed="false">Hugging Face</button>
            <button type="button" data-filter="local" aria-pressed="false">Pulled</button>
          </div>
          <div class="browser-rows" id="mb-list" role="listbox" aria-label="Models"></div>
        </aside>
        <section class="browser-card" id="mb-card"></section>
      </div>
    </section>

    <section class="view view-shell hidden" id="view-shell" role="tabpanel">
      <div class="terminal-host">
        <div class="terminal-pane" id="terminal-pane"></div>
      </div>
      <div class="shell-overlay hidden" id="shell-overlay">
        <div class="shell-overlay-card">
          <svg viewBox="0 0 24 24" class="shell-overlay-icon"><use href="#i-terminal"/></svg>
          <div class="shell-overlay-text" id="shell-overlay-text"></div>
          <button class="btn primary" id="shell-restart">Open a new shell</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Settings -->
  <dialog class="dialog" id="settings-dialog">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2>Settings</h2>
        <button class="icon-btn" id="settings-close" aria-label="Close"><svg viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
      </div>
      <label class="field field-row">
        <span>Appearance</span>
        <select id="setting-theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label class="field field-row">
        <span>Your name</span>
        <input class="input" id="setting-name" placeholder="for the greeting">
      </label>
      <label class="field">
        <span>Default system prompt</span>
        <textarea id="setting-system" rows="3" placeholder="Used by new conversations"></textarea>
      </label>
      <label class="field field-row">
        <span>Send with</span>
        <select id="setting-enter">
          <option value="enter">Enter (Shift+Enter for a newline)</option>
          <option value="mod-enter">⌘/Ctrl+Enter</option>
        </select>
      </label>
      <label class="field field-row">
        <span>API key</span>
        <input class="input" id="setting-api-key" type="password" autocomplete="off" placeholder="only if llmman serve requires one">
      </label>
      <div class="field">
        <span>Data</span>
        <div class="row gap">
          <button class="btn" id="export-chats">Export chats</button>
          <button class="btn danger" id="clear-chats">Delete all chats</button>
        </div>
        <p class="muted small">Conversations are stored in this browser only; the daemon keeps none.</p>
      </div>
      <div class="about muted small" id="about-line"></div>
    </div>
  </dialog>

  <!-- Camera -->
  <dialog class="dialog camera-dialog" id="camera-dialog" aria-label="Take a photo">
    <div class="dialog-body">
      <video id="camera-video" autoplay playsinline muted></video>
      <form method="dialog" class="dialog-actions">
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn primary" type="button" id="camera-snap">Take photo</button>
      </form>
    </div>
  </dialog>

  <div class="toast hidden" id="toast" role="status"></div>
</div>
