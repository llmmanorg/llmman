[package]
name = "llmman"
version = "0.1.0"
edition = "2021"
description = "LLM model management tool using Docker or Podman transport libraries"
license = "Apache-2.0"

[[bin]]
name = "llmman"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive", "wrap_help"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"
hex        = "0.4"
base64     = "0.22"
anyhow     = "1"
walkdir    = "2"
chrono     = { version = "0.4", features = ["serde"] }
dirs       = "5"
tar        = "0.4"
axum       = "0.7"
libc       = "0.2"
tokio-util = { version = "0.7", features = ["io"] }
toml       = { version = "0.8", default-features = false, features = ["parse"] }
tokio      = { version = "1", features = ["full"] }
reqwest    = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls", "http2", "charset"] }
futures    = "0.3"
indicatif  = "0.18"
flate2     = "1"
zip        = { version = "2", default-features = false, features = ["deflate"] }
libloading = "0.8"
# `llmman sign` — cosign-compatible Sigstore signing (keyless via Fulcio +
# Rekor, or key-based). `sigstore` pulls in its own copy of reqwest
# (0.13, vs. the 0.12 above) since the two aren't semver-compatible yet;
# that's an accepted, harmless duplication rather than vendoring Sigstore's
# client/crypto code ourselves.
sigstore              = { version = "0.14", default-features = false, features = ["sign", "oauth", "sigstore-trust-root", "rustls-tls"] }
sigstore_protobuf_specs = "0.5"
p256       = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ecdsa      = "0.16"
pkcs8      = { version = "0.10", features = ["pem"] }
webbrowser = "1.0"

[features]
default = ["docker"]
docker = []
podman = []

[build-dependencies]
flate2 = "1"
