[package]
name = "llmman"
version = "0.1.0"
edition = "2021"
description = "llmman manages OCI models"
license = "Apache-2.0"

[lib]
name = "llmman"
path = "src/lib.rs"

[[bin]]
name = "llmman"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive", "wrap_help"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"
hex        = "0.4"
base64     = "0.22"
anyhow     = "1"
walkdir    = "2"
chrono     = { version = "0.4", features = ["serde"] }
dirs       = "5"
tar        = "0.4"
axum       = "0.7"
libc       = "0.2"
tokio-util = { version = "0.7", features = ["io"] }
toml       = { version = "0.8", default-features = false, features = ["parse"] }
tokio      = { version = "1", features = ["full"] }
reqwest    = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls", "http2", "charset"] }
futures    = "0.3"
indicatif  = "0.18"
flate2     = "1"
zip        = { version = "2", default-features = false, features = ["deflate"] }
libloading = "0.8"
multer     = "3"

# Real Xet-protocol downloads for HuggingFace files too large for the
# plain-HTTP path to reliably serve — see src/xet_fetch.rs. Exact-pinned
# (not "1.6") since these are xet-core's own internal workspace crates,
# not independently semver-stable APIs, despite being on crates.io.
hf-xet         = "=1.6.0"
xet-client     = "=1.6.0"
xet-data       = { version = "=1.6.0", default-features = false, features = ["rustls-tls"] }
xet-runtime    = "=1.6.0"
reqwest-middleware = "0.5"

[features]
default = ["docker"]
docker = []
podman = []

[build-dependencies]
flate2 = "1"
