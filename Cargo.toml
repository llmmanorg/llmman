[package]
name = "llmman"
version = "0.1.0"
edition = "2021"
description = "llmman manages OCI models"
license = "Apache-2.0"

[lib]
name = "llmman"
path = "src/lib.rs"

[[bin]]
name = "llmman"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive", "wrap_help"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"
hex        = "0.4"
base64     = "0.22"
anyhow     = "1"
walkdir    = "2"
chrono     = { version = "0.4", features = ["serde"] }
dirs       = "5"
tar        = "0.4"
axum       = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
libc       = "0.2"
tokio-util = { version = "0.7", features = ["io"] }
toml       = { version = "0.8", default-features = false, features = ["parse"] }
tokio      = { version = "1", features = ["full"] }
reqwest    = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls", "http2", "charset"] }
futures    = "0.3"
bytes      = "1"
indicatif  = "0.18"
flate2     = "1"
zip        = { version = "2", default-features = false, features = ["deflate"] }
libloading = "0.8"
multer     = "3"

# Real Xet-protocol downloads for HuggingFace files too large for the
# plain-HTTP path to reliably serve — see src/xet_fetch.rs. Its
# xet_session API re-exports XetFileInfo (from xet-data) and HeaderMap
# (from http) directly, so this is the only xet-core crate needed
# here. Exact-pinned (not "1.6") since it's one of xet-core's own
# internal workspace crates, not an independently semver-stable API,
# despite being on crates.io.
hf-xet = "=1.6.0"

[features]
default = ["docker"]
docker = []
podman = []

[build-dependencies]
flate2 = "1"
