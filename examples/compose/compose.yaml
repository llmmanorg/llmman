services:
  llmman:
    # llmman inside the llama.cpp CPU image (docs/backends.md); pin with
    # LLMMAN_TAG=server-<version>, or pick a GPU variant.
    image: docker.io/ai/llmman:${LLMMAN_TAG:-server}
    entrypoint: llmman
    command: serve
    cpus: ${LLMMAN_CPUS:-4}
    restart: unless-stopped
    environment:
      # The daemon binds 0.0.0.0 inside the container, which it refuses to
      # do without API keys unless told the omission is deliberate. Only
      # the gateway's port is published, so authentication is Caddy's
      # job here. To have the daemon check keys itself:
      #   LLMMAN_AUTH= LLMMAN_API_KEYS=<key> docker compose ... up
      LLMMAN_AUTH: ${LLMMAN_AUTH-off}
      LLMMAN_API_KEYS: ${LLMMAN_API_KEYS-}
    volumes:
      - llmman-data:/root/.local/share/llmman

  gateway:
    image: caddy:2-alpine
    depends_on:
      - llmman
    ports:
      - "${LLMMAN_PORT:-8080}:80"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  llmman-data:
